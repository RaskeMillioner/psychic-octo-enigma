# Builds the PWA and publishes it to GitHub Pages, so the app has a permanent
# HTTPS address to install to a phone's home screen from.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Then every push to this branch redeploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/wine-tracking-app-8ymwqw']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
