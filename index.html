    <script>
      // Stamps the theme before anything paints. The real preference lives in
      // IndexedDB with the rest of the settings, which is read asynchronously —
      // far too late to avoid a black flash on a light-mode launch — so
      // src/lib/theme.ts mirrors it into localStorage for this one line to read.
      (function () {
        try {
          var choice = localStorage.getItem('cellarbook-theme') || 'dark';
          var light =
            choice === 'light' ||
            (choice === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', light ? '#f7f2ee' : '#16110f');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
